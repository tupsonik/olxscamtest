name: Build Flappy Steroids APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed | head -80
          ls -d "$ANDROID_HOME/platforms/"* "$ANDROID_HOME/build-tools/"*

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlappySteroids-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Runtime smoke test on Android emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          force-avd-creation: true
          wipe-data: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb kill-server || true
            adb start-server
            adb reconnect
            adb wait-for-device
            for i in $(seq 1 30); do
              STATE=$(adb get-state 2>/dev/null || true)
              if [ "$STATE" = "device" ]; then break; fi
              adb reconnect || true
              sleep 2
            done
            adb get-state
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n pl.tupsonik.flappysteroids/.MainActivity
            sleep 2
            adb exec-out screencap -p > flappy-menu.png
            adb shell input tap 540 960
            sleep 1
            for i in $(seq 1 24); do
              adb shell input tap 540 960
              sleep 0.12
            done
            adb exec-out screencap -p > flappy-playing.png
            adb shell am force-stop pl.tupsonik.flappysteroids

      - name: Upload runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlappySteroids-runtime-screens
          path: |
            flappy-menu.png
            flappy-playing.png
            app/build/reports/tests/**
          if-no-files-found: ignore

